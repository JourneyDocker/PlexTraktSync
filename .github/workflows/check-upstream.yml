name: Check Upstream Updates

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest upstream commit from main branch
        id: upstream
        run: |
          commit=$(git ls-remote https://github.com/Taxel/PlexTraktSync.git refs/heads/main | cut -f1)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Get last built commit from repo variables
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if value=$(gh variable get LAST_UPSTREAM_COMMIT 2>/dev/null); then
            echo "commit=$value" >> "$GITHUB_OUTPUT"
            echo "Last built: $value"
          else
            echo "commit=" >> "$GITHUB_OUTPUT"
            echo "Last built: (none)"
          fi

      - name: Compare and decide
        id: decide
        run: |
          if [ "${{ steps.last.outputs.commit }}" = "${{ steps.upstream.outputs.commit }}" ]; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits — skipping"
          else
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commit — triggering build"
          fi

      - name: Update last built commit variable
        if: steps.decide.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set LAST_UPSTREAM_COMMIT --body "${{ steps.upstream.outputs.commit }}"

      - name: Trigger Docker Publish Main
        if: steps.decide.outputs.trigger == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-publish-main.yml',
              ref: 'main',
            });
