name: Check Upstream Updates

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest upstream commit
        id: upstream
        run: |
          commit=$(git ls-remote https://github.com/Taxel/PlexTraktSync.git refs/heads/main | cut -f1)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check if this commit was already built
        id: cache
        uses: actions/cache@v4
        with:
          path: .upstream_commit
          key: upstream-commit-${{ steps.upstream.outputs.commit }}

      - name: Save commit marker for new upstream
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "${{ steps.upstream.outputs.commit }}" > .upstream_commit

      - name: Decide whether to trigger
        id: decide
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "trigger=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits — skipping"
          else
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commit — triggering build"
          fi

      - name: Trigger Docker Publish Main
        if: steps.decide.outputs.trigger == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-publish-main.yml',
              ref: 'main',
            });
